[versions]
kotlin = "2.3.21"
agp = "8.11.2"
compose = "1.10.0"
material3 = "1.9.0"
coroutines = "1.10.2"
serialization = "1.9.0"
ktor = "3.4.3"
koin = "4.1.0"
lifecycle = "2.9.6"
bitcoin = "0.32.0"
secp256k1 = "0.24.0"
kable = "0.41.0"

[libraries]
bignum = { module = "com.ionspin.kotlin:bignum", version = "0.3.10" }
bitcoin = { module = "fr.acinq.bitcoin:bitcoin-kmp", version.ref = "bitcoin" }
secp-android = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-android", version.ref = "secp256k1" }
tink-android = { module = "com.google.crypto.tink:tink-android", version = "1.10.0" }
secp-jvm = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm", version.ref = "secp256k1" }
keccak = { module = "org.kotlincrypto.hash:sha3", version = "0.8.0" }
kable = { module = "com.juul.kable:kable-core", version.ref = "kable" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.3" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version = "4.3.0" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
material-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version = "3.3.0" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version = "3.3.0" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
