<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>BJJ-Cold-Wallet · Donations</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1517;
        --panel: #142326;
        --ink: #ecf5f0;
        --muted: #b2c5c0;
        --accent: #9debba;
        --line: #314749;
        font:
          17px/1.65 system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        max-width: 1040px;
        margin: auto;
        padding: 32px 24px 60px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      a {
        color: var(--accent);
        text-underline-offset: 4px;
      }
      .brand {
        font-weight: 800;
        font-size: 1.1rem;
        letter-spacing: 0.02em;
      }
      .locale {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      select {
        font: inherit;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
      }
      h1 {
        font-size: clamp(2.2rem, 6vw, 4.2rem);
        line-height: 1.12;
        max-width: 850px;
        letter-spacing: -0.035em;
        margin: 64px 0 24px;
      }
      .lead {
        font-size: 1.15rem;
        max-width: 800px;
        color: var(--muted);
      }
      .need {
        border-left: 3px solid var(--accent);
        padding: 10px 20px;
        margin: 28px 0 44px;
        max-width: 800px;
      }
      h2 {
        font-size: 1.3rem;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel);
        padding: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
      }
      .token {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.6rem;
        margin: 0;
      }
      .coin {
        display: grid;
        place-items: center;
        background: #277e6c;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 1.3rem;
        font-weight: 800;
      }
      .network {
        color: var(--muted);
        margin: 0;
      }
      .qr {
        width: min(100%, 250px);
        height: auto;
        aspect-ratio: 1;
        border-radius: 10px;
        background: white;
      }
      .address {
        display: block;
        width: 100%;
        background: #0c1517;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        font:
          13px/1.5 ui-monospace,
          monospace;
        overflow-wrap: anywhere;
        user-select: all;
      }
      .copy {
        width: 100%;
        min-height: 48px;
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        background: var(--accent);
        color: #10251a;
        cursor: pointer;
      }
      .copy:hover {
        background: #c0f6d3;
      }
      .copy:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      :focus-visible {
        outline: 3px solid #f7d576;
        outline-offset: 4px;
      }
      .note {
        color: var(--muted);
        margin-top: 24px;
      }
      .status {
        min-height: 2em;
        margin: 8px 0;
        color: var(--accent);
      }
      footer {
        margin-top: 36px;
        color: var(--muted);
      }
      @media (max-width: 620px) {
        .cards {
          grid-template-columns: 1fr;
        }
        main {
          padding: 24px 16px 40px;
        }
        h1 {
          margin-top: 44px;
        }
        .card {
          padding: 22px;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f3f8f4;
          --panel: #fff;
          --ink: #172d27;
          --muted: #435d54;
          --accent: #176744;
          --line: #c4d6cb;
        }
        .address {
          background: #f3f8f4;
          color: var(--ink);
        }
        .copy {
          background: #176744;
          color: #fff;
        }
        .copy:hover {
          background: #105536;
        }
        .coin {
          color: white;
        }
      }
    </style>
  </head>

        </section>
      </div>
      <p class="note" data-i18n="scan"></p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <footer>
        <p data-i18n="thanks"></p>
        <a id="back" href="../../README.md" data-i18n="back"></a>
      </footer>
    </main>
